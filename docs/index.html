<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Full team and player statistics for every Atlantic 10 women's volleyball program, refreshed nightly.">
<title>A-10 Volleyball Stat Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface2:#f8f9f7; --ink:#15191e; --muted:#5b636c; --faint:#8a929a;
  --rule:#dde0de; --chip:#eaece8; --nav:#1b222b; --navink:#e9ecef; --navmuted:#9aa4ae; --navrule:#2c3540;
  --good:#1d7a4a; --bad:#b3261e; --warn:#9a6a00; --focus:#2f6fd6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101317; --surface:#171b20; --surface2:#1c2127; --ink:#e7eaed; --muted:#a0a8b1; --faint:#737c86;
    --rule:#2a3038; --chip:#232930; --nav:#0b0e11; --navink:#e7eaed; --navmuted:#8d97a2; --navrule:#222a33;
    --good:#4cc38a; --bad:#f07167; --warn:#e0b04a; --focus:#7aa7ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101317; --surface:#171b20; --surface2:#1c2127; --ink:#e7eaed; --muted:#a0a8b1; --faint:#737c86;
  --rule:#2a3038; --chip:#232930; --nav:#0b0e11; --navink:#e7eaed; --navmuted:#8d97a2; --navrule:#222a33;
  --good:#4cc38a; --bad:#f07167; --warn:#e0b04a; --focus:#7aa7ff;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--nav);color:var(--navink);padding-block:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--navrule)}
.brand b{display:block;font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--navmuted)}
.navsec{padding:14px 12px 4px;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--navmuted);padding-left:20px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;color:var(--navink);font-size:13.5px}
.nav button:hover{background:var(--navrule)}
.nav button[aria-current="page"]{background:var(--navrule);box-shadow:inset 3px 0 0 var(--navink)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .rec{margin-left:auto;white-space:nowrap;color:var(--navmuted);font-variant-numeric:tabular-nums;font-size:12px}
.nav .soon{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--navmuted);border:1px solid var(--navrule);padding:2px 6px;border-radius:3px}
.nav button[disabled]{cursor:default;opacity:.7}
.nav button[disabled]:hover{background:none}

/* main */
.main{padding-inline:32px;padding-block:24px 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.top h1{margin:0;font:700 34px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:6px}
.fresh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.banner{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--rule);border-radius:6px;padding:8px 12px;margin-bottom:20px}
.banner b{color:var(--warn);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 16px 10px}
.ph h2{margin:0;font:600 19px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.ph .note{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.leaders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.lcat{padding:12px 16px 14px;border-top:1px solid var(--rule)}
.lcat:not(:nth-child(3n+1)){border-left:1px solid var(--rule)}
.lcat h3{margin:0 0 8px;font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lrow{display:grid;grid-template-columns:16px auto 1fr auto;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.lrow .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.lrow .v{font-variant-numeric:tabular-nums;font-weight:600}
.lrow:first-of-type .v{font-size:15px}
.pname{all:unset;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname:hover{text-decoration:underline}

/* team badge */
.tb{display:inline-grid;place-items:center;min-width:38px;height:21px;padding:0 5px;border-radius:3px;font:700 12px/1 var(--display);letter-spacing:.05em;background:var(--c1);color:var(--ct);box-shadow:inset 0 -3px 0 var(--c2);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);flex:none}
.tlink{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.tlink:hover .tn{text-decoration:underline}
.tlink:focus-visible{outline:2px solid var(--focus)}

/* tables */
.tw{overflow-x:auto;border-top:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{background:var(--surface2);font:600 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th.sorted{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
th.l,td.l{text-align:left}
td.rk{color:var(--faint);width:28px}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td.lead{font-weight:700}
td.sc{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.pos{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:600;background:var(--chip);border-radius:3px;padding:1px 4px;color:var(--muted)}
.clickrow{cursor:pointer}

/* controls */
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--chip);border-radius:6px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--focus)}
select,input[type="search"]{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font-size:12.5px}
input[type="search"]{width:170px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

/* bar chart */
.bars{padding:4px 16px 16px;display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.track{height:14px;background:var(--chip);border-radius:2px;position:relative}
.fill{position:absolute;inset:0 auto 0 0;border-radius:2px}
.opp{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);padding:0 16px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--muted);vertical-align:-1px;margin-right:5px}
.legend i.tick{width:2px;height:12px;background:var(--ink);opacity:.55}

/* team page */
.band{background:var(--c1);color:var(--ct);border-radius:8px;padding:22px 24px 20px;box-shadow:inset 0 -6px 0 var(--c2);margin-bottom:18px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.mono{font:700 56px/0.9 var(--display);letter-spacing:.02em;border:3px solid var(--c2);padding:6px 12px 4px;border-radius:6px}
.band h1{margin:0;font:700 40px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.band .masc{opacity:.85;font-size:14px;margin-top:4px}
.recs{display:flex;gap:22px;text-align:right}
.recs div b{display:block;font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.recs div span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
.tile{padding:12px 16px;border-right:1px solid var(--rule)}
.tile:nth-child(5n){border-right:0}
.tile:nth-child(n+6){border-top:1px solid var(--rule)}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .r{font-size:12px;color:var(--muted)}
.tile .r.top{color:var(--good);font-weight:600}
.tile .r.bot{color:var(--bad)}
.chart{padding:0 16px 12px}
.chart svg{display:block;width:100%;height:auto}
.phase2{display:flex;gap:14px;align-items:flex-start;padding:16px;color:var(--muted);font-size:13px}
.phase2 b{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:18px}

/* compare */
.cmphead{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:18px}
.cside{background:var(--c1);color:var(--ct);border-radius:8px;padding:14px 18px;box-shadow:inset 0 -5px 0 var(--c2);display:flex;flex-direction:column;gap:8px}
.cside.r{text-align:right;align-items:flex-end}
.cside select{background:color-mix(in srgb,var(--ct) 14%,transparent);color:var(--ct);border-color:color-mix(in srgb,var(--ct) 35%,transparent);font:600 18px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase}
.cside select option{color:#15191e;background:#fff}
.cside .cr{font-size:13px;opacity:.9}
.vs{align-self:center;font:700 28px/1 var(--display);color:var(--faint)}
.crow{display:grid;grid-template-columns:64px 1fr 170px 1fr 64px;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.crow .lab{text-align:center;font-size:12.5px;color:var(--muted)}
.crow .lab small{display:block;font-size:10.5px;color:var(--faint)}
.crow .val{font-weight:500}
.crow .val.win{font-weight:700}
.crow .val.l{text-align:right}
.half{height:12px;background:var(--chip);border-radius:2px;position:relative}
.half .fill{inset:0 auto 0 0}
.half.l .fill{inset:0 0 0 auto}
.win-mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin:0 6px;vertical-align:2px}
.cleaders{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cleaders > div{padding:10px 16px 14px}
.cleaders > div + div{border-left:1px solid var(--rule)}

/* grouped stat tables (school stats-page layout) */
tr.grp th{cursor:default;text-align:center;font:italic 700 13px/1 var(--display);letter-spacing:.08em;padding-block:8px 2px;border-bottom:0}
tr.grp th:hover{color:var(--muted)}
td.gs,th.gs{border-left:1px solid var(--rule)}
tfoot td{font-weight:700;background:var(--surface2);border-bottom:1px solid var(--rule)}
tfoot tr.oppr td{color:var(--muted);font-weight:600}
.teamtbl th{background:var(--c1);color:var(--ct);border-bottom-color:transparent}
.teamtbl th:hover,.teamtbl tr.grp th:hover{color:var(--ct);opacity:.9}
.teamtbl th.sorted{color:var(--ct);box-shadow:inset 0 -3px 0 var(--c2)}
.teamtbl td.gs,.teamtbl th.gs{border-left-color:color-mix(in srgb,var(--ink) 14%,transparent)}
.teamtbl .tw{border-top:0}
.teamtbl th,.teamtbl td{padding-inline:7px}
.stath{display:flex;align-items:baseline;gap:14px;padding:16px 16px 10px;border-bottom:3px solid var(--ink)}
.stath h2{margin:0;font:700 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.stath .note{font-size:12px;color:var(--faint);margin-left:auto}
.tsgrid{columns:4 240px;column-gap:28px;padding:4px 16px 16px}
.tsg{margin-top:12px;break-inside:avoid;width:100%}
.tsg th,.tsg td{padding:5px 8px}
.tsg th{cursor:default}
.tsg tbody tr:last-child td{border-bottom:1px solid var(--rule)}
.ab{color:var(--faint);font-size:11px;margin-left:3px}
.realtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--good);border:1px solid currentColor;border-radius:3px;padding:1px 6px}
.foot{margin-top:28px;font-size:12px;color:var(--faint);max-width:80ch}

@media (max-width:1100px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile:nth-child(5n){border-right:1px solid var(--rule)}
  .tile:nth-child(3n){border-right:0}
  .tile:nth-child(n+4){border-top:1px solid var(--rule)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding-block:14px}
  .nav.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding-inline:16px}
  .leaders{grid-template-columns:minmax(0,1fr)}
  .lcat:not(:nth-child(3n+1)){border-left:0}
  .band{grid-template-columns:1fr}
  .recs{text-align:left}
  .mono{justify-self:start;font-size:40px}
  .cmphead{grid-template-columns:1fr}
  .cside.r{text-align:left;align-items:flex-start}
  .vs{display:none}
  .crow{grid-template-columns:52px 1fr 52px;}
  .crow .half{display:none}
  .cleaders{grid-template-columns:1fr}
  .cleaders > div + div{border-left:0;border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>
</head>
<body>

    <div class="navsec">Programs</div>
    <nav class="nav teams" id="teamnav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

  k:{k:'k',label:'K',g:'Attack',get:G('k'),title:'Kills'},
  kps:{k:'kps',label:'K/S',g:'Attack',get:G('kps'),fmt:f2,lead:1,title:'Kills per set'},
  e:{k:'e',label:'E',g:'Attack',get:G('e'),title:'Attack errors'},
  ta:{k:'ta',label:'TA',g:'Attack',get:G('ta'),title:'Total attack attempts'},
  pct:{k:'pct',label:'PCT',g:'Attack',get:G('pct'),fmt:f3,title:'Hitting percentage'},
  a:{k:'a',label:'A',g:'Set',get:G('a'),title:'Assists'},
  aps:{k:'aps',label:'A/S',g:'Set',get:G('aps'),fmt:f2,lead:1,title:'Assists per set'},
  sa:{k:'sa',label:'SA',g:'Serve',get:G('sa'),title:'Service aces'},
  sps:{k:'sps',label:'SA/S',g:'Serve',get:G('sps'),fmt:f2,lead:1,title:'Aces per set'},
  se:{k:'se',label:'SE',g:'Serve',get:G('se'),title:'Service errors'},
  dig:{k:'dig',label:'DIG',g:'Dig',get:G('dig'),title:'Digs'},
  dps:{k:'dps',label:'DIG/S',g:'Dig',get:G('dps'),fmt:f2,lead:1,title:'Digs per set'},
  re:{k:'re',label:'RE',g:'Recept',get:G('re'),title:'Reception errors'},
  rta:{k:'rta',label:'TA',g:'Recept',get:G('rta'),title:'Reception attempts'},
  recp:{k:'recp',label:'Rec%',g:'Recept',get:G('recp'),fmt:f3,title:'Reception percentage'},
  reps:{k:'reps',label:'RE/S',g:'Recept',get:G('reps'),fmt:f2,title:'Reception errors per set'},
  bs:{k:'bs',label:'BS',g:'Block',get:G('bs'),title:'Block solos'},
  ba:{k:'ba',label:'BA',g:'Block',get:G('ba'),title:'Block assists'},
  blk:{k:'blk',label:'BLK',g:'Block',get:G('blk'),fmt:f1,title:'Total blocks'},
  bps:{k:'bps',label:'BLK/S',g:'Block',get:G('bps'),fmt:f2,lead:1,title:'Blocks per set'},
  be:{k:'be',label:'BE',g:'Block',get:G('be'),title:'Block errors'},
  bhe:{k:'bhe',label:'BHE',g:'Block',get:G('bhe'),title:'Ball-handling errors'},
};
const OFF=['sp','mp','ms','pts','pps','k','kps','e','ta','pct','a','aps','sa','sps','se'];
const DEF=['sp','dig','dps','re','rta','recp','reps','bs','ba','blk','bps','be','bhe'];
const nameCol={k:'name',label:'Player',l:1,get:r=>r.name};
function teamCols(side){return [{k:'num',label:'#',l:1,get:r=>r.num,sort:r=>r.numv,fmt:v=>v},nameCol,...(side==='off'?OFF:DEF).map(k=>COL[k])]}
function leaderCols(side){
  const qpct={...COL.pct,get:r=>r.ta>=10?r.pct:null,lead:1,title:'Hitting percentage (min. 10 attempts)'};
  const qrec={...COL.recp,get:r=>r.rta>=20?r.recp:null,title:'Reception % (min. 20 attempts)'};
  return [{k:'_rk',label:'Rk',get:()=>0},
    {...nameCol,fmt:(v,r)=>`${v} <span style="color:var(--faint)">#${r.num}</span>`},
    {k:'team',label:'Team',l:1,get:r=>TM[r.team].abbr,fmt:(v,r)=>tlink(TM[r.team],false)},
    ...(side==='off'?OFF:DEF).map(k=>k==='pct'?qpct:k==='recp'?qrec:COL[k])];
}
const allPlayers=()=>TEAMS.flatMap(t=>sd(t)?sd(t).players:[]);
const qualifies=p=>p.sp>=.6*(tot(TM[p.team]).sp||0);

/* ---------- views ---------- */
const FRESH=`<div class="fresh"><span class="dot"></span>Updated ${updated} · refreshes nightly at midnight</div>`;
function header(title,sub,extra=''){
  return `<div class="top"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="ctrls">${extra}${FRESH}</div></div>`;
}
const pctOf=([w,l])=>w+l?w/(w+l):0;
const standings=()=>[...TEAMS].sort((a,b)=>pctOf([b.cw,b.cl])-pctOf([a.cw,a.cl])||b.cw-a.cw||pctOf([b.ow,b.ol])-pctOf([a.ow,a.ol]));

function vDashboard(){
  const A=t=>t.all?t.all.total:{};
  const rows=standings().map(t=>Object.assign({},t,{_row:`class="clickrow" data-go="team-${t.id}"`}));
  const cols=[
    {k:'_rk',label:'#',get:()=>0},
    {k:'name',label:'Team',l:1,get:t=>t.name,fmt:(v,t)=>tlink(TM[t.id])},
    {k:'conf',label:CS,get:t=>pctOf([t.cw,t.cl])*100+t.cw,fmt:(v,t)=>`${t.cw}-${t.cl}`},
    {k:'ovr',label:'Overall',get:t=>pctOf([t.ow,t.ol]),fmt:(v,t)=>`${t.ow}-${t.ol}`},
    {k:'strk',label:'Streak',get:t=>t.streak,fmt:v=>v},
    {k:'pct',label:'Hit%',get:t=>A(t).pct,fmt:f3,lead:1},
    {k:'opct',label:'Opp Hit%',get:t=>A(t).opct,fmt:f3,lead:1,low:1},
    {k:'kps',label:'K/S',get:t=>A(t).kps,fmt:f2,lead:1},
    {k:'dps',label:'D/S',get:t=>A(t).dps,fmt:f2,lead:1},
    {k:'bps',label:'B/S',get:t=>A(t).bps,fmt:f2,lead:1},
  ];
  const byHit=TEAMS.filter(t=>t.all).sort((a,b)=>A(b).pct-A(a).pct), mx=.35;
  const bars=byHit.map(t=>`<div class="bar">${badge(t)}<div class="track"><div class="fill" style="width:${Math.max(0,A(t).pct)/mx*100}%;background:${barColor(t)}"></div><div class="opp" style="left:${Math.max(0,A(t).opct)/mx*100}%"></div></div><span>${f3(A(t).pct)}</span></div>`).join('');
  const qual=TEAMS.flatMap(t=>t.all?t.all.players.filter(p=>p.sp>=.6*t.all.total.sp):[]);
  const cats=[['Kills per set','kps',f2],['Assists per set','aps',f2],['Digs per set','dps',f2],['Blocks per set','bps',f2],['Aces per set','sps',f2],['Hitting %','pct',f3,p=>p.ta>=3*TM[p.team].all.total.sp]];
  const leaders=cats.map(([lab,k,fmt,extra])=>{
    const top=qual.filter(extra||(()=>1)).sort((a,b)=>b[k]-a[k]).slice(0,5);
    return `<div class="lcat"><h3>${lab}</h3>${top.map((p,i)=>`<div class="lrow"><span class="n">${i+1}</span>${tlink(TM[p.team],false)}<button class="pname" data-go="team-${p.team}">${p.name}</button><span class="v">${fmt(p[k])}</span></div>`).join('')}</div>`;
  }).join('');
  return header('Conference Dashboard',`All ${TEAMS.length} ${CF} programs · ${DATA.season} season`)+
  `<div class="grid2">
    <section class="panel"><div class="ph"><h2>Standings</h2><span class="note">Click a team for its full stats · stats are all matches</span></div>${table('stand',cols,rows,{key:'conf',dir:'desc'})}</section>
    <section class="panel"><div class="ph"><h2>Hitting efficiency</h2><span class="note">All matches</span></div>
      <div class="legend"><span><i></i>Team hitting %</span><span><i class="tick"></i>Opponents' hitting % vs. them</span></div>
      <div class="bars">${bars}</div></section>
  </div>
  <section class="panel"><div class="ph"><h2>Individual leaders</h2><span class="note">Minimum 60% of team sets played · Hit% also min. 3 attempts per team set</span></div><div class="leaders">${leaders}</div></section>`;
}

function vTeams(){
  const rate=S.mode==='rate', T=k=>t=>tot(t)[k]??null;
  const c=(k,label,rk,title,low)=>({k:rate?rk:k,label:rate?label+'/S':label,get:T(rate?rk:k),fmt:rate?f2:f0,lead:1,low,title});
  const cols=[
    {k:'_rk',label:'#',get:()=>0},
    {k:'name',label:'Team',l:1,get:t=>t.name,fmt:(v,t)=>tlink(t)},
    {k:'sp',label:'Sets',get:T('sp')},
    {k:'pct',label:'Hit%',get:T('pct'),fmt:f3,lead:1},
    {k:'opct',label:'Opp Hit%',get:T('opct'),fmt:f3,lead:1,low:1},
    c('k','K','kps','Kills'),
    ...(rate?[]:[{k:'e',label:'E',get:T('e'),lead:1,low:1},{k:'ta',label:'TA',get:T('ta')}]),
    c('a','A','aps','Assists'), c('sa','SA','sps','Service aces'), c('se','SE','seps','Service errors',1),
    {k:'recp',label:'Rec%',get:T('recp'),fmt:f3,lead:1},
    c('re','RE','reps','Reception errors',1), c('dig','Dig','dps','Digs'), c('blk','Blk','bps','Blocks'), c('pts','Pts','pps','Points'),
  ];
  return header('Team Stats','Every program side by side · sortable · bold = conference best',splitSeg()+seg('mode',[['rate','Per set'],['total','Totals']],S.mode))+
  `<section class="panel"><div class="ph"><h2>${splitName()}</h2><span class="note">Click any column to sort · lower is better for Opp Hit%, E, SE, RE</span></div>${table('teams',cols,TEAMS,{key:'pct',dir:'desc'})}</section>`;
}

function vPlayers(){
  const f=S.pf;
  const rows=allPlayers().filter(p=>(!f.team||p.team===f.team)&&(!f.q||p.name.toLowerCase().includes(f.q.toLowerCase()))&&(!f.qual||qualifies(p)));
  const filters=`<div class="ctrls">
    ${seg('side',[['off','Offensive'],['def','Defensive']],S.side)}
    <select id="pf-team" data-pf="team" aria-label="Team"><option value="">All teams</option>${TEAMS.map(t=>`<option value="${t.id}" ${t.id===f.team?'selected':''}>${t.name}</option>`).join('')}</select>
    <input type="search" id="pf-q" data-pf="q" placeholder="Search player" value="${f.q}">
    <label class="chk"><input type="checkbox" id="pf-qual" data-pf="qual" ${f.qual?'checked':''}> Qualified only (60% of team sets)</label>
  </div>`;
  return header('Player Leaders',`Individual season stats for every ${CS} player`,splitSeg())+
  `<section class="panel"><div class="ph">${filters}<span class="note">${rows.length} players</span></div>${table('players-'+S.side,leaderCols(S.side),rows,S.side==='off'?{key:'kps',dir:'desc'}:{key:'dps',dir:'desc'})}</section>`;
}

/* Team page: team statistics + offensive + defensive, laid out like the schools' own stats pages */
const TS_GROUPS=[
  ['Attack',[['Kills','K','k',f0],['Errors','E','e',f0],['Attempts','TA','ta',f0],['Percent','PCT','pct',f3],['Kills per set','K/S','kps',f2]]],
  ['Set',[['Assists','A','a',f0],['Assists per set','A/S','aps',f2],['Ball-handling errors','BHE','bhe',f0]]],
  ['Serve',[['Aces','SA','sa',f0],['Errors','SE','se',f0],['Aces per set','SA/S','sps',f2]]],
  ['Reception',[['Errors','RE','re',f0],['Attempts','TA','rta',f0],['Percent','Rec%','recp',f3],['Errors per set','RE/S','reps',f2]]],
  ['Defense',[['Digs','DIG','dig',f0],['Digs per set','DIG/S','dps',f2]]],
  ['Blocking',[['Solo','BS','bs',f0],['Assists','BA','ba',f0],['Errors','BE','be',f0],['Blocks','BLK','blk',f1],['Blocks per set','BLK/S','bps',f2]]],
  ['Scoring',[['Sets played','SP','sp',f0],['Points','PTS','pts',f1],['Points per set','PTS/S','pps',f2]]],
];
function teamStatsPanel(t,x){
  const groups=TS_GROUPS.map(([g,rows])=>`<table class="tsg"><thead><tr><th class="l">${g}</th><th>${t.abbr}</th><th>OPP</th></tr></thead><tbody>${rows.map(([lab,ab,k,fmt])=>`<tr><td class="l">${lab} <span class="ab">${ab}</span></td><td>${fmt(x.total[k]??null)}</td><td>${x.opp?fmt(x.opp[k]??null):'—'}</td></tr>`).join('')}</tbody></table>`).join('');
  return `<section class="panel teamtbl" style="${tvars(t)}"><div class="stath"><h2>Team Statistics</h2><span class="note">${t.name} vs. opponents · ${splitName()}</span></div><div class="tsgrid">${groups}</div></section>`;
}
function statTable(t,x,side){
  return `<section class="panel teamtbl" style="${tvars(t)}"><div class="stath"><h2>${side==='off'?'Offensive':'Defensive'}</h2><span class="note">${splitName()} · click a column to sort · bold = team best per set</span></div>
  ${table(`${side}-${t.id}`,teamCols(side),x.players,{key:'num',dir:'asc'},{foot:[{label:'Total',row:x.total},{label:'Opponents',cls:'oppr',row:x.opp}]})}</section>`;
}
function vTeam(id){
  const t=TM[id]; if(!t)return vDashboard();
  const x=sd(t), host=t.source?new URL(t.source).host:'';
  const body=x?`${teamStatsPanel(t,x)}${statTable(t,x,'off')}${statTable(t,x,'def')}`
    :`<section class="panel"><div class="phase2">${S.split==='conf'?`No ${CS} match stats yet for ${t.name}.`:`Stats couldn't be read from ${host} in the last refresh. They'll return after the next successful nightly import.`}</div></section>`;
  return `<div class="band" style="${tvars(t)}"><div class="mono">${t.abbr}</div><div><h1>${t.name}</h1><div class="masc">${t.masc} · ${DATA.season} season</div></div>
    <div class="recs"><div><b>${t.cw}-${t.cl}</b><span>${CS}</span></div><div><b>${t.ow}-${t.ol}</b><span>Overall</span></div><div><b>${t.streak||'—'}</b><span>Streak</span></div><div><b>${ord(standings().indexOf(t)+1)}</b><span>Standings</span></div></div></div>
  <div class="top"><div class="sub">Source: <a href="${t.source}" target="_blank" rel="noopener" style="color:inherit">${host} cumulative stats</a></div><div class="ctrls">${splitSeg()}<button class="tlink" data-go="compare" data-cmp="${id}" style="font-size:12.5px;text-decoration:underline">Compare with another team →</button>${FRESH}</div></div>
  ${t.stale?`<div class="banner"><b>Not refreshed last night.</b> ${host} couldn't be read, so these are the stats from ${fmtDate(t.fetched)}. They'll update after the next successful nightly import.</div>`:''}
  <div class="stack">${body}
    <section class="panel"><div class="phase2"><span class="tb" style="--c1:var(--chip);--c2:var(--rule);--ct:var(--muted)">P2</span><div><b>Match log &amp; box scores</b> come in phase 2. The same stats pages already carry match-by-match numbers, so they can be added without redesigning this page.</div></div></section>
  </div>`;
}

function vCompare(){
  const [a,b]=S.cmp.map(i=>TM[i]), A=tot(a), B=tot(b);
  const sel=(side,cur)=>`<select id="cmp-${side}" data-cmp-side="${side}" aria-label="Team ${side+1}">${TEAMS.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${t.name}</option>`).join('')}</select>`;
  const rows=[['Hitting %','pct',f3],['Opp. hitting %','opct',f3,1],['Kills / set','kps',f2],['Assists / set','aps',f2],['Aces / set','sps',f2],['Service errors / set','seps',f2,1],['Reception %','recp',f3],['Reception errors / set','reps',f2,1],['Digs / set','dps',f2],['Blocks / set','bps',f2],['Points / set','pps',f2]].map(([lab,k,fmt,low])=>{
    const va=A[k]??0,vb=B[k]??0,mx=Math.max(va,vb,.001)*1.1,aw=low?va<vb:va>vb,bw=low?vb<va:vb>va;
    return `<div class="crow"><span class="val l ${aw?'win':''}">${aw?'<span class="win-mark"></span>':''}${fmt(A[k]??null)}</span><div class="half l"><div class="fill" style="width:${Math.max(0,va)/mx*100}%;background:${barColor(a)}"></div></div><span class="lab">${lab}${low?'<small>lower is better</small>':''}</span><div class="half"><div class="fill" style="width:${Math.max(0,vb)/mx*100}%;background:${barColor(b)}"></div></div><span class="val ${bw?'win':''}">${fmt(B[k]??null)}${bw?'<span class="win-mark"></span>':''}</span></div>`}).join('');
  const lead=t=>{const ps=sd(t)?sd(t).players.filter(qualifies):[];return [['Kills / set','kps'],['Assists / set','aps'],['Digs / set','dps'],['Blocks / set','bps'],['Aces / set','sps']].map(([l,k])=>{const p=[...ps].sort((x,y)=>y[k]-x[k])[0];return p?`<div class="lrow"><span class="n"></span><span class="pos">#${p.num}</span><span>${p.name} <span style="color:var(--faint)">· ${l}</span></span><span class="v">${f2(p[k])}</span></div>`:''}).join('')};
  return header('Compare','Pick any two programs · green dot marks the better number',splitSeg())+
  `<div class="cmphead"><div class="cside" style="${tvars(a)}">${sel(0,a.id)}<span class="cr">${a.cw}-${a.cl} ${CS} · ${a.ow}-${a.ol} overall</span></div><div class="vs">VS</div><div class="cside r" style="${tvars(b)}">${sel(1,b.id)}<span class="cr">${b.cw}-${b.cl} ${CS} · ${b.ow}-${b.ol} overall</span></div></div>
  <div class="stack"><section class="panel"><div class="ph"><h2>Head to head</h2><span class="note">${splitName()}</span></div>${rows}</section>
  <section class="panel"><div class="ph"><h2>Top performers</h2><span class="note">Qualified players only</span></div><div class="cleaders"><div>${tlink(a)}${lead(a)}</div><div>${tlink(b)}${lead(b)}</div></div></section></div>`;
}

/* ---------- shell ---------- */
const VIEWS=[['dashboard','Dashboard'],['teams','Team Stats'],['players','Player Leaders'],['compare','Compare']];
function render(){
  document.getElementById('brandsub').textContent=`Stat Hub · ${DATA.season} season`;
  const r=S.route;
  document.getElementById('mainnav').innerHTML=VIEWS.map(([k,l])=>`<button data-go="${k}" ${r===k?'aria-current="page"':''}>${l}</button>`).join('')+`<button disabled>Box Scores<span class="soon">Phase 2</span></button>`;
  document.getElementById('teamnav').innerHTML=standings().map(t=>`<button data-go="team-${t.id}" ${r==='team-'+t.id?'aria-current="page"':''}>${badge(t)}<span>${t.name}</span><span class="rec">${t.cw}-${t.cl}</span></button>`).join('');
  const m=document.getElementById('main');
  m.innerHTML=r.startsWith('team-')?vTeam(r.slice(5)):r==='teams'?vTeams():r==='players'?vPlayers():r==='compare'?vCompare():vDashboard();
  m.insertAdjacentHTML('beforeend',`<p class="foot">Stats come from each school's official athletics stats page; standings from ${CONF.conference.standingsSite}. Last import: ${updated}.</p>`);
}
function go(route){S.route=route;try{history.replaceState(null,'','#'+route)}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(g.dataset.cmp&&g.dataset.cmp!==S.cmp[0])S.cmp=[g.dataset.cmp,S.cmp[0]===g.dataset.cmp?S.cmp[1]:S.cmp[0]];go(g.dataset.go);return}
  const th=e.target.closest('[data-sort]');
  if(th){const[id,key]=th.dataset.sort.split('|'),s=S.sorts[id];
    if(s&&s.key===key)s.dir=s.dir==='asc'?'desc':'asc';else{const low=['opct','e','se','re','seps','reps','be','bhe','name','team','num','strk'].includes(key);S.sorts[id]={key,dir:low?'asc':'desc'}}
    render();return}
  const sb=e.target.closest('[data-set]');
  if(sb){const[k,v]=sb.dataset.set.split('|');S[k]=v;render()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.pf){S.pf[el.dataset.pf]=el.type==='checkbox'?el.checked:el.value;render()}
  if(el.dataset.cmpSide){S.cmp[+el.dataset.cmpSide]=el.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pf-q'){S.pf.q=e.target.value;render();const i=document.getElementById('pf-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(e){}
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
</script>

</body>
</html>
