name: Nightly stats refresh

on:
  schedule:
    # 12:05 AM Eastern during the season (Aug–Dec). GitHub schedules run in UTC, so this
    # fires at both 04:05 and 05:05 UTC to cover daylight and standard time; the
    # "midnight check" step below skips whichever run isn't just after midnight ET.
    - cron: '5 4,5 * 8-12 *'
  workflow_dispatch: # "Run workflow" button on the Actions tab for a manual refresh

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Midnight check
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "00" ] || [ "$hour" = "01" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: it's ${hour}:00 in Eastern time"; echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: ruby/setup-ruby@v1
        if: steps.gate.outputs.go == 'true'
        with:
          ruby-version: '3.3'

      - name: Import stats from each school
        if: steps.gate.outputs.go == 'true'
        run: ruby scripts/scrape.rb

      - name: Build the website
        if: steps.gate.outputs.go == 'true'
        run: ruby scripts/build.rb

      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No stat changes tonight."
          else
            git commit -m "Nightly stats refresh $(TZ=America/New_York date +%F)"
            git push
          fi
